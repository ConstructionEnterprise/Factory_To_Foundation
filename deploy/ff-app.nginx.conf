# Real AWS Phase 3 (public HTTPS access) nginx vhost for ff-app-host,
# checked in as the reproducible source of truth — not byte-identical to
# what's live on the instance, since `certbot --nginx --redirect` rewrote
# this file in place to add its own ssl_certificate/ssl_certificate_key
# directives and a real 301 http->https redirect server block. Re-apply
# this source file + re-run certbot to reproduce the deployment from
# scratch; don't hand-copy the live instance's post-certbot version back
# here.
#
# Real hostname: 52-14-82-76.sslip.io — a public wildcard-DNS service
# (resolves automatically to the Elastic IP, no registration/DNS
# management needed) used instead of a purchased domain or the raw EC2
# *.compute.amazonaws.com hostname, since Let's Encrypt's ACME server
# refuses to issue certs for cloud-provider-generated hostnames (confirmed
# live: "Cannot issue for ... because it is forbidden by policy"). If the
# Elastic IP (eipalloc-027b9155e6688fd0c, 52.14.82.76) is ever released or
# reassigned, this hostname and the cert both need reissuing for the new IP.
#
# Frontend is a static production build (`npm run build` with
# VITE_BACKEND_URL="" so API calls are relative/same-origin) deployed to
# /opt/ff-deploy/ff-frontend-dist on the instance. Backend API paths below
# are every real top-level prefix registered in backend/src/routes/*.ts,
# enumerated exactly (not a wildcard/guessed prefix) - confirmed zero
# collisions with any real frontend SPA route.

server {
    listen 80;
    server_name 52-14-82-76.sslip.io;

    # Real backend API paths (backend/src/routes/*.ts's own registered
    # top-level prefixes, enumerated exactly, not guessed) - proxied to the
    # real backend container on 4300. Everything else is the built frontend
    # SPA. Confirmed zero collisions between these and any real frontend
    # client-side route (manufacturing/factory/robotics/logistics/
    # construction/scheduling/permissions/networking/assets/analytics/
    # reports/administration/genealogy-root).
    location ^~ /health { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /auth { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /construction-sites { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /construction-files { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /compliance-documents { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /users { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /instruction-executions { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /logistics-materials { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /logistics-modules { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /logistics-drivers { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /logistics-dispatches { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /logistics-trucks { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /logistics-files { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /manufacturing-model { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /schedule-tasks { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /schedule-task-dependencies { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /rbac-directory { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /network-topology { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
    location ^~ /user-preferences { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }

    root /opt/ff-deploy/ff-frontend-dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
