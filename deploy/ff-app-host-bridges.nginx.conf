# Real nginx vhost, ff-app-host — reverse-proxies twin-bridge (4100) and
# blender-bridge (4200) over the same real Let's Encrypt cert this
# instance already has (52-14-82-76.sslip.io, see ff-app.nginx.conf's own
# header comment for why sslip.io instead of a purchased domain/the raw
# EC2 hostname). This is a NEW, focused config, not the old ff-app.nginx.conf
# revived — ff-app-host's original nginx (frontend + full backend API) was
# deliberately stopped/disabled once the CloudFront/ASG cutover happened
# (§26); this instance's only real public job now is these two bridges,
# reached exclusively through CloudFront as a third real origin (never
# directly), per the real "expose the twin properly" decision (Responsive
# UI milestone) — real auth was added to both bridges first (they now
# require a valid session, and the state-changing endpoints require the
# real matching RBAC grant), and this config's own X-Origin-Verify check
# is a second, independent real layer: even a caller who somehow gets a
# valid session cookie can't reach these bridges by hitting the instance's
# own IP/sslip.io hostname directly, only through the real CloudFront
# distribution, which is the only thing that knows this secret header.
#
# The real secret value here is a placeholder for the deploy step, not a
# real production value — see the deploy notes in CLAUDE.md §28.8 for the
# real generated secret and where it's actually applied (nginx config on
# the instance + the CloudFront origin's custom header, both need the
# exact same real value, never checked into git).

server {
    listen 443 ssl;
    server_name 52-14-82-76.sslip.io;

    # Real path: certbot's own standard convention (§23) — this instance's
    # cert was obtained directly via certbot, not distributed via S3 the
    # way the ASG instances' own certs are (a different, separate real
    # cert-distribution model, §25 — don't confuse the two).
    ssl_certificate /etc/letsencrypt/live/52-14-82-76.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/52-14-82-76.sslip.io/privkey.pem;

    # Real origin-verification gate — rejects anything that didn't come
    # through the real CloudFront distribution (which is the only place
    # this header value is configured). Checked before either bridge
    # location, so a request missing/wrong on this never even reaches a
    # real bridge process.
    if ($http_x_origin_verify != "REPLACE_WITH_REAL_SECRET") {
        return 403;
    }

    location ^~ /twin-bridge-api/ {
        rewrite ^/twin-bridge-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4100;
        include /etc/nginx/ff-proxy-params.conf;
    }

    location ^~ /blender-bridge-api/ {
        rewrite ^/blender-bridge-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4200;
        include /etc/nginx/ff-proxy-params.conf;
    }

    location / {
        return 404;
    }
}

# Plain-HTTP requests get a real redirect to HTTPS, matching every other
# real vhost in this deployment's own convention - never served in the
# clear.
server {
    listen 80;
    server_name 52-14-82-76.sslip.io;
    return 301 https://$host$request_uri;
}
