# Shared real backend API path routing for the FF backend ASG's nginx -
# included by both the port-80 (initial/HTTP-only) and port-443 (once a
# real cert exists) server blocks in ff-backend-asg.nginx.conf, so the
# same real, enumerated path list never has to be kept in sync by hand
# across two copies.
#
# §31 API Namespace Rule: /api/ is the real, current path CloudFront now
# forwards for every application API (see CLAUDE.md §31.4) -- every route
# below it is additive/legacy, kept only for direct-to-NLB reachability
# (this session's own debugging pattern) and left in deliberately rather
# than coupling their removal to this migration, same reasoning as leaving
# /health* alone in CloudFront.
location ^~ /api/ { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
location ^~ /health { proxy_pass http://127.0.0.1:4300; include /etc/nginx/ff-proxy-params.conf; }
