# Real nginx vhost for backend-only Auto Scaling Group instances
# (AWS Phase 4 HA build) - distinct from deploy/ff-app.nginx.conf, which
# is ff-app-host's original single-instance config (frontend + backend
# co-located). These ASG instances run ONLY the backend container +
# nginx TLS termination behind the Network Load Balancer
# (ff-backend-nlb) - the frontend now lives on S3 + CloudFront, not here.
#
# server_name matches the NLB's own Elastic IP-derived sslip.io hostname
# (3-23-62-46.sslip.io -> 3.23.62.46, the real static EIP bound to the
# NLB) - the same "no purchased domain" real constraint and Let's
# Encrypt cloud-hostname-policy workaround as ff-app-host's own cert
# (CLAUDE.md §23), just for the NLB's own address instead of a single
# instance's.
#
# The real cert here is NOT obtained by certbot running locally on this
# specific instance - these are ephemeral, auto-scaled boxes. One real
# cert is obtained once (via a real HTTP-01 challenge routed through the
# NLB to whichever instance is healthy at that moment) and distributed
# to every instance via S3 (see the launch template's user-data). If no
# cert exists in S3 yet (only true before the very first real issuance),
# this instance serves HTTP-only so that first challenge can succeed.
# The 443 server block is appended by the user-data script itself once a
# real cert is confirmed present - not included here unconditionally.

server {
    listen 80;
    server_name 3-23-62-46.sslip.io;
    include /etc/nginx/sites-available/ff-backend-asg-locations.conf;
}
